version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: gosti-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gosti_db
      POSTGRES_USER: gosti_user
      POSTGRES_PASSWORD: gosti123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
